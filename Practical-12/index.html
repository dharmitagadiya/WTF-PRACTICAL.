<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">StudentHub</a>
            <button id="logoutBtn" class="btn btn-light btn-sm hidden">
                Logout
            </button>
        </div>
    </nav>
    <main class="container py-4">
        <!-- Login and Registration -->
        <section id="authSection" class="auth-card">
            <h2 class="text-center">StudentHub Admin</h2>
            <div class="text-center mb-3">
                <button class="btn btn-outline-primary" id="showLogin">
                    Login
                </button>
                <button class="btn btn-outline-primary" id="showRegister">
                    Register
                </button>
            </div>
            <form id="loginForm">
                <h4>Admin Login</h4>
                <input type="email" id="loginEmail"
                       class="form-control mb-3"
                       placeholder="Email" required>
                <input type="password" id="loginPassword"
                       class="form-control mb-3"
                       placeholder="Password" required>
                <button class="btn btn-primary w-100">
                    Login
                </button>
            </form>
            <form id="registerForm" class="hidden">
                <h4>Admin Registration</h4>
                <input type="text" id="adminName"
                       class="form-control mb-3"
                       placeholder="Admin Name" required>
                <input type="email" id="adminEmail"
                       class="form-control mb-3"
                       placeholder="Email" required>
                <input type="password" id="adminPassword"
                       class="form-control mb-3"
                       placeholder="Password (minimum 8 characters)"
                       minlength="8" required>
                <button class="btn btn-success w-100">
                    Register
                </button>
            </form>
        </section>
        <!-- Dashboard -->
        <section id="dashboard" class="hidden">
            <h2 class="mb-3">Admin Dashboard</h2>
            <div class="card summary-card mb-4">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <h2 id="totalStudents">0</h2>
                </div>
            </div>
            <!-- Add Student Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <h4 id="formTitle">Add New Student</h4>
                    <form id="studentForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="text" id="enrollment"
                                       class="form-control"
                                       placeholder="Enrollment Number"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" id="studentName"
                                       class="form-control"
                                       placeholder="Student Name"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <select id="branch" class="form-select" required>
                                    <option value="">Select Branch</option>
                                    <option>Computer Engineering</option>
                                    <option>Information Technology</option>
                                    <option>Mechanical Engineering</option>
                                    <option>Electrical Engineering</option>
                                    <option>Civil Engineering</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <select id="semester" class="form-select" required>
                                    <option value="">Select Semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="email" id="studentEmail"
                                       class="form-control"
                                       placeholder="Student Email"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="tel" id="mobile"
                                       class="form-control"
                                       placeholder="10-digit Mobile Number"
                                       pattern="[0-9]{10}"
                                       required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary"
                                id="saveBtn">
                            Add Student
                        </button>
                        <button type="button" id="cancelEdit"
                                class="btn btn-secondary hidden">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>
            <!-- Student Records -->
            <div class="card">
                <div class="card-body">
                    <h4>Student Records</h4>
                    <input type="search" id="searchInput"
                           class="form-control mb-3"
                           placeholder="Search by name or enrollment number">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped">
                            <thead class="table-primary">
                                <tr>
                                    <th>Enrollment</th>
                                    <th>Name</th>
                                    <th>Branch</th>
                                    <th>Semester</th>
                                    <th>Email</th>
                                    <th>Mobile</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <p id="message" class="mt-3 text-center"></p>
    </main>
    <footer class="text-center p-3">
        StudentHub © 2026
    </footer>
    <script src="script.js"></script>
</body>
</html>
